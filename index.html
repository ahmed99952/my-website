<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Mon Portfolio</title>
  <style>
    /* Reset & Styles de Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
    
  
  /* 2. Superposition : un dégradé sombre transparent + une image texturée en arrière-plan */
  background-image: 
    linear-gradient(to bottom, rgba(11, 15, 21, 0.75), rgba(11, 15, 21, 0.95)),  
    url(smoky-background-1920-x-1080-oo37pgp3fo1292my.jpg); /* Remplacez par le lien ou le nom de votre image texturée */
  
  /* 3. Ajustement de l'image */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed; /* Crée un effet de profondeur sympa au scroll */
  
  color: #c9d1d9;
  line-height: 1.6;
  margin: 0;
  padding-bottom: 60px;

    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* En-tête / Navigation */
    header {
      position: sticky;
      top: 0;
      background-color: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #30363d;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    header div:first-child {
      font-weight: bold;
      font-size: 1.2rem;
      color: #f0f6fc;
    }

    nav a {
      margin-left: 1.5rem;
      color: #8b949e;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #58a6ff;
    }

    /* Sections Principales */
    section {
      max-width: 800px;
      margin: 0 auto;
      padding: 4rem 1.5rem 2rem;
    }

    /* Section À propos & Photo */
    #about {
      text-align: center;
      padding-top: 3rem;
    }

    #about div {
      width: 300px;
      height: 300px;
      margin: 0 auto 3rem;
      border-radius: 80%;
      overflow: hidden;
      border: 3px solid #58a6ff;
      box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
    }

    #about img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #about h1 {
      font-size: 2.2rem;
      color: #f0f6fc;
      margin-bottom: 0.5rem;
    }

    #about p:nth-of-type(1) {
      font-size: 1.1rem;
      color: #8b949e;
      margin-bottom: 1.5rem;
    }

    /* Titres de section */
    h2 {
      font-size: 1.5rem;
      color: #f0f6fc;
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    /* Compétences */
    #skills ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      list-style: none;
    }

    #skills li {
      background-color: #161b22;
      border: 1px solid #30363d;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #58a6ff;
    }

    /* Projets */
    #projects {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    #projects > div {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    #projects > div:hover {
      transform: translateY(-3px);
      border-color: #58a6ff;
    }

    #projects h3 {
      color: #f0f6fc;
      margin-bottom: 0.5rem;
    }

    /* Formulaire de Contact */
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: 500;
      color: #8b949e;
      font-size: 0.9rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 1rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #58a6ff;
    }

    button[type="submit"] {
      padding: 0.75rem 1.5rem;
      background-color: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.2s;
    }

    button[type="submit"]:hover {
      background-color: #2ea043;
    }

    /* Pied de page */
    footer {
      text-align: center;
      padding: 2rem;
      color: #8b949e;
      font-size: 0.9rem;
      border-top: 1px solid #30363d;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div>Mon Portfolio</div>
    <nav>
      <a href="#about">À propos</a>
      <a href="#skills">Compétences</a>
      <a href="#projects">Projets</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Section À propos -->
  <section id="about">
    <div>
      <img src="Portrait professionnel en extérieur modernes.png" alt="Portrait d'Ahmed Boussaoud" width="200">
    </div>
    <h1>Ahmed Boussaoud</h1>
    <p>Étudiant en génie logiciel</p>
    <p>Bienvenue sur mon site personnel. Passionné par le développement logiciel.</p>
  </section>

  <!-- Section Compétences -->
  <section id="skills">
    <h2>Compétences</h2>
    <ul>
      <li>Bientôt...</li>
    </ul>
  </section>

  <!-- Section Projets -->
  <section id="projects">
    <h2>Projets</h2>
    <div>
      <h3>Aucun projet disponible</h3>
    </div>
  </section>

  <!-- Section Contact -->
  <section id="contact">
    <h2>Me Contacter</h2>
    <form action="#" method="post" onsubmit="return verifierEmail()">
      <label for="name">Nom et Prénom :</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email :</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message :</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <button type="submit">Envoyer</button>
    </form>
  </section>

  <!-- Pied de page -->
  <footer>
    <p>&copy; 2026 - Tous droits réservés.</p>
  </footer>

  <script src="code.js"></script>
</body>
</html>
